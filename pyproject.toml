[project]
name = "nclt-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rkv-freelancer", email = "143656295+rkv-freelancer@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "psycopg[binary]>=3.3.6",
]

[project.scripts]
nclt-lab = "nclt_lab:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]